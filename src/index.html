<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>angular-21</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Angular 20 Form Application" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    
    <!-- DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Critical CSS - Inline for instant render -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
      body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;line-height:1.6;color:#333;background:#f5f5f5}
      app-root{display:block;min-height:100vh}
      .spinner{display:flex;align-items:center;justify-content:center;min-height:100vh;font-size:1.125rem;color:#666}
      .spinner::after{content:'';width:40px;height:40px;margin-left:12px;border:4px solid #f3f3f3;border-top:4px solid #3498db;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}
    </style>
  </head>
  <body>
    <app-root>
      <div class="spinner">Loading application</div>
    </app-root>
  </body>
</html>
