<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>angular-21</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Angular 20 Form Application" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    
    <!-- Preconnect to improve loading performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    
    <!-- Inline critical CSS will be injected here by Vite -->
    <style>
      /* Critical CSS for initial render */
      app-root {
        display: block;
        min-height: 100vh;
      }
      
      /* Prevent layout shift during loading */
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <app-root>
      <!-- Loading indicator -->
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div style="text-align: center;">
          <div style="border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto;"></div>
          <p style="margin-top: 16px; color: #666;">Loading...</p>
        </div>
      </div>
    </app-root>
    
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </body>
</html>
